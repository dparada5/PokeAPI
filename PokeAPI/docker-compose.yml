version: "3.8"

services:
  proxy:
    build: .
    container_name: pokeapi-proxy
    command: ["node", "src/proxy_server.js"]
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=development
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5174/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: pokeapi-web
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    depends_on:
      - proxy